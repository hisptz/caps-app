name: Deploy

on:
    release:
        types: [published]
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm run build

            - run: pnpm run deploy --username ${{ secrets.DHIS2_USERNAME }} --password ${{ secrets.DHIS2_PASSWORD }} ${{ vars.DHIS2_INSTANCE_URL }}
