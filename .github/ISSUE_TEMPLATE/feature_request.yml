name: Feature request
description: Propose a change to the CAPS DHIS2 app
title: '[feat] '
labels: ['enhancement']
body:
    - type: markdown
      attributes:
          value: |
              For backend pipeline/API work, use [hisptz/caps-engine](https://github.com/hisptz/caps-engine) instead.
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: What is hard or missing in the operator console?
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed solution
      validations:
          required: true
    - type: dropdown
      id: area
      attributes:
          label: Area
          options:
              - Pipelines / handler forms
              - Monitoring / executions
              - Climate data
              - Settings / DHIS2 Route
              - Analytics
              - Accessibility / i18n
              - Other
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
    - type: checkboxes
      id: contributing
      attributes:
          label: Willing to contribute
          options:
              - label: I can open a PR following CONTRIBUTING.md
